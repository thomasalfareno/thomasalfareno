<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none">
  <rect width="280" height="40" rx="8" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Left Side Badge Frame -->
  <path d="M 0 8 A 8 8 0 0 1 8 0 L 140 0 L 130 40 L 8 40 A 8 8 0 0 1 0 32 Z" fill="#EE4C2C" fill-opacity="0.15" />
  <line x1="130" y1="0" x2="130" y2="40" stroke="#EE4C2C" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Label in perfect Indonesian -->
  <text x="16" y="24" font-family="'Fira Code', monospace" font-size="11" font-weight="extrabold" fill="#EE4C2C" letter-spacing="1">PENGUNJUNG PROFIL</text>

  <!-- Number & Status in perfect Indonesian -->
  <text x="148" y="25" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#f1f5f9">
    <tspan fill="#f1f5f9">3.490</tspan> <tspan fill="#4ade80" font-size="9">ONLINE</tspan>
  </text>

  <!-- Pulsing Live Point -->
  <circle cx="260" cy="20" r="4.5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
</svg>