<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
        .terminal-window {
          background-color: #020617;
          border: 1px solid #1e293b;
          border-radius: 10px;
          font-family: 'Fira Code', monospace;
          font-size: 11.5px;
          color: #f1f5f9;
          padding: 15px;
          box-shadow: 0 15px 35px rgba(0,0,0,0.6);
          height: 235px;
          box-sizing: border-box;
        }
        .dots {
          display: flex;
          gap: 6px;
          margin-bottom: 12px;
        }
        .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
        }
        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #eab308; }
        .dot-green { background-color: #22c55e; }
        
        .line {
          display: block;
          margin-bottom: 4px;
          white-space: nowrap;
          overflow: hidden;
        }
        
        .prompt {
          color: #EE4C2C;
          font-weight: bold;
          margin-right: 8px;
        }
        
        @keyframes b {
          50% { opacity: 0; }
        }
        
        .type1 {
          width: 0;
          animation: t1 15s steps(60) infinite;
        }
        .out1 {
          opacity: 0;
          animation: o1 15s forwards infinite;
        }
        
        .type2 {
          width: 0;
          animation: t2 15s steps(40) infinite;
        }
        .out2 {
          opacity: 0;
          animation: o2 15s forwards infinite;
        }
        
        .type3 {
          width: 0;
          animation: t3 15s steps(70) infinite;
        }
        .out3 {
          opacity: 0;
          animation: o3 15s forwards infinite;
        }
        
        @keyframes t1 { 0% { width: 0; } 15%, 100% { width: 480px; } }
        @keyframes o1 { 0%, 14.9% { opacity: 0; } 15%, 100% { opacity: 1; } }
        
        @keyframes t2 { 0%, 25% { width: 0; } 40%, 100% { width: 330px; } }
        @keyframes o2 { 0%, 39.9% { opacity: 0; } 40%, 100% { opacity: 1; } }
        
        @keyframes t3 { 0%, 50% { width: 0; } 70%, 100% { width: 510px; } }
        @keyframes o3 { 0%, 69.9% { opacity: 0; } 70%, 100% { opacity: 1; } }
      </style>
      <div class="terminal-window">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid #1e293b; padding-bottom: 6px;">
          <div class="dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div style="font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">
            sh — interactive — local@its-fteic
          </div>
        </div>
        
        <div style="display: flex; flex-direction: column;">
          <div>
            <span class="prompt">$</span><span class="line type1" style="display: inline-block; vertical-align: middle;">!git clone https://github.com/thomasalfareno/SpaceAX-AI-BETA.git</span>
          </div>
          <span class="out1" style="color: #4ade80; padding-left: 14px; margin-bottom: 6px; font-size: 11px;">
            Kloning ke 'SpaceAX-AI-BETA'... Selesai! [12.4 MB]
          </span>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div>
            <span class="prompt">$</span><span class="line type2" style="display: inline-block; vertical-align: middle;">!pip install -r requirements.txt</span>
          </div>
          <span class="out2" style="color: #cbd5e1; padding-left: 14px; margin-bottom: 6px; font-size: 11px;">
            Mengunduh paket dependensi: torch-2.1.2, numpy-1.24.3, rich [Sukses]
          </span>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div>
            <span class="prompt">$</span><span class="line type3" style="display: inline-block; vertical-align: middle;">!python main.py train --size small --epoch 200 --batch-size 20 --regen</span>
          </div>
          <span class="out3" style="color: #a78bfa; padding-left: 14px; font-size: 11px; font-weight: bold;">
            🚀 Pelatihan Aktif: Epoch 200/200 | Loss Leksikon KBBI: 1.2483 | weights/saved.pt
          </span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>