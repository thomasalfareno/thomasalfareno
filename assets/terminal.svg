<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" fill="none">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&amp;display=swap');
        .terminal-window {
          background-color: #020617;
          border: 1px solid #1e293b;
          border-radius: 10px;
          font-family: 'Fira Code', monospace;
          font-size: 13px;
          color: #f1f5f9;
          padding: 15px;
          box-shadow: 0 15px 35px rgba(0,0,0,0.6);
          height: 220px;
          box-sizing: border-box;
        }
        .dots {
          display: flex;
          gap: 6px;
          margin-bottom: 12px;
        }
        .dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
        }
        .dot-red { background-color: #ef4444; }
        .dot-yellow { background-color: #eab308; }
        .dot-green { background-color: #22c55e; }
        
        .line {
          display: block;
          margin-bottom: 6px;
          white-space: nowrap;
          overflow: hidden;
        }
        
        .prompt {
          color: #4ade80;
          font-weight: bold;
          margin-right: 8px;
        }
        
        @keyframes blink {
          50% { opacity: 0; }
        }
        
        .type1 {
          width: 0;
          animation: t1 12s steps(35) infinite;
        }
        .out1 {
          opacity: 0;
          animation: o1 12s forwards infinite;
        }
        
        .type2 {
          width: 0;
          animation: t2 12s steps(45) infinite;
        }
        .out2 {
          opacity: 0;
          animation: o2 12s forwards infinite;
        }
        
        .type3 {
          width: 0;
          animation: t3 12s steps(35) infinite;
        }
        .out3 {
          opacity: 0;
          animation: o3 12s forwards infinite;
        }
        
        @keyframes t1 { 0% { width: 0; } 16.6%, 100% { width: 280px; } }
        @keyframes o1 { 0%, 16.5% { opacity: 0; } 16.6%, 100% { opacity: 1; } }
        
        @keyframes t2 { 0%, 20.8% { width: 0; } 37.5%, 100% { width: 330px; } }
        @keyframes o2 { 0%, 37.4% { opacity: 0; } 37.5%, 100% { opacity: 1; } }
        
        @keyframes t3 { 0%, 41.6% { width: 0; } 58.3%, 100% { width: 360px; } }
        @keyframes o3 { 0%, 58.2% { opacity: 0; } 58.3%, 100% { opacity: 1; } }
      </style>
      <div class="terminal-window">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #1e293b; padding-bottom: 8px;">
          <div class="dots">
            <div class="dot dot-red"></div>
            <div class="dot dot-yellow"></div>
            <div class="dot dot-green"></div>
          </div>
          <div style="font-size: 10px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">
            sh --interactive — local@its-fteic
          </div>
        </div>
        
        <div style="display: flex; flex-direction: column;">
          <div>
            <span class="prompt">$</span><span class="line type1" style="display: inline-block; vertical-align: middle;">python main.py chat --size promax</span>
          </div>
          <span class="out1" style="color: #94a3b8; padding-left: 14px; margin-bottom: 6px; font-size: 12px;">
            [SpaceAX AI] Initializing decoder-only transformer weights... Ready!
          </span>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div>
            <span class="prompt">$</span><span class="line type2" style="display: inline-block; vertical-align: middle;">import torch; model = SpaceAX(); model.train()</span>
          </div>
          <span class="out2" style="color: #a78bfa; padding-left: 14px; margin-bottom: 6px; font-size: 12px;">
            Training loop active: self-learning from real-time KBBI active.
          </span>
        </div>

        <div style="display: flex; flex-direction: column;">
          <div>
            <span class="prompt">$</span><span class="line type3" style="display: inline-block; vertical-align: middle;">console.log("Thomas Alfareno Ananta Nugraha: Decoders &amp; Web");</span>
          </div>
          <span class="out3" style="color: #EE4C2C; padding-left: 14px; font-size: 12px; font-weight: bold;">
            🚀 Output: Thomas Alfareno Ananta Nugraha @ Informatics FTEIC ITS Surabaya
          </span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>