<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" fill="none">
  <style>
    @keyframes pulse {
      0%, 100% { r: 5; opacity: 0.4; }
      50% { r: 12; opacity: 0; }
    }
    @keyframes lineDraw {
      0% { stroke-dashoffset: 240; }
      100% { stroke-dashoffset: 0; }
    }
    .g-pulse { animation: pulse 3s infinite ease-in-out; }
    .wave-path {
      stroke: url(#lineGrad);
      stroke-dasharray: 60, 15;
      animation: lineDraw 10s linear infinite;
    }
    .lbl { font-family: 'Fira Code', 'Courier New', monospace; font-size: 9.5px; fill: #64748b; font-weight: bold; label-spacing: 0.5px; }
    .val { font-family: 'Fira Code', 'Courier New', monospace; font-size: 11.5px; fill: #f1f5f9; }
    .val-dim { font-family: 'Fira Code', 'Courier New', monospace; font-size: 10px; fill: #94a3b8; }
    .val-sub { font-family: 'Fira Code', 'Courier New', monospace; font-size: 9px; fill: #64748b; }
    .title { font-family: 'Fira Code', 'Courier New', monospace; font-size: 13.5px; font-weight: bold; fill: #ffffff; }
  </style>
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE4C2C" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EE4C2C" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  
  <rect width="620" height="180" rx="12" fill="#020617" stroke="#1e293b" stroke-width="1.5" />
  <rect width="620" height="180" rx="12" fill="url(#neonGlow)" />

  <!-- Pulse Tracker Status -->
  <circle cx="40" cy="35" r="10" fill="#EE4C2C" fill-opacity="0.1" />
  <circle cx="40" cy="35" r="14" fill="#EE4C2C" fill-opacity="0.05" class="g-pulse" />
  <circle cx="40" cy="35" r="4.5" fill="#EE4C2C" />

  <!-- Header Text -->
  <text x="65" y="39" class="title" letter-spacing="0.5">SISTEM TELEMETRI ITS FTEIC AKTIF</text>
  <line x1="25" y1="60" x2="595" y2="60" stroke="#1e293b" stroke-width="1" />

  <!-- Column 1: Identity of operator (Width ~285px) -->
  <text x="30" y="85" class="lbl" fill="#EE4C2C">PENGEMBANG UTAMA</text>
  <text x="30" y="104" class="val" font-weight="bold">Thomas Alfareno Ananta Nugraha</text>
  <text x="30" y="122" class="val-dim" fill="#94a3b8">Teknik Informatika (Informatics Engineering) - Angkatan 2026</text>
  <text x="30" y="140" class="val-sub" fill="#64748b">Institut Teknologi Sepuluh Nopember (ITS)</text>

  <!-- Column 2: System Status metrics (Shifted to x=325 to secure comfort buffer) -->
  <text x="325" y="85" class="lbl" fill="#a78bfa">SISTEM RUNTIME MESIN</text>
  <text x="325" y="104" class="val">Status Node: <tspan fill="#4ade80" font-weight="bold">ONLINE</tspan></text>
  <text x="325" y="122" class="val-dim">Backend: PyTorch &amp; MySQL</text>
  <text x="325" y="140" class="val-sub">Dekoder Inti: Teroptimasi</text>

  <!-- Column 3: Signal vector graphics (Shifted to x=480 for beautiful alignment) -->
  <text x="480" y="85" class="lbl" fill="#4ade80">SINYAL REAL-TIME</text>
  <path d="M 480 120 Q 510 95, 525 120 T 560 120 T 600 110" stroke="#1e293b" stroke-width="2" fill="none" />
  <path d="M 480 120 Q 510 95, 525 120 T 560 120 T 600 110" stroke-width="2" fill="none" class="wave-path" />
  <circle cx="600" cy="110" r="3" fill="#6366f1" />
</svg>