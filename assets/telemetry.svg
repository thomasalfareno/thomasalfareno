<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" fill="none">
  <style>
    @keyframes pulse {
      0%,100% { r:6; opacity:.45; }
      50% { r:14; opacity:0; }
    }

    @keyframes lineDraw {
      from { stroke-dashoffset: 240; }
      to   { stroke-dashoffset: 0; }
    }

    @keyframes blink {
      0%,100% { opacity:1; }
      50% { opacity:.4; }
    }

    .pulse { animation:pulse 3s infinite ease-in-out; }

    .wave {
      stroke:url(#waveGrad);
      stroke-width:2.5;
      stroke-dasharray:60 15;
      animation:lineDraw 10s linear infinite;
    }

    .online {
      animation:blink 2s infinite;
    }

    .title {
      font-family:'Fira Code','Courier New',monospace;
      font-size:14px;
      font-weight:700;
      fill:#fff;
    }

    .label {
      font-family:'Fira Code','Courier New',monospace;
      font-size:9px;
      font-weight:700;
      fill:#94a3b8;
      letter-spacing:1px;
    }

    .value {
      font-family:'Fira Code','Courier New',monospace;
      font-size:11px;
      fill:#f8fafc;
    }

    .sub {
      font-family:'Fira Code','Courier New',monospace;
      font-size:9px;
      fill:#64748b;
    }
  </style>

  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EE4C2C" stop-opacity=".10"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity=".03"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EE4C2C"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Main Panel -->
  <rect width="620" height="220"
        rx="16"
        fill="#020617"
        stroke="#1E293B"
        stroke-width="1.5"/>

  <rect width="620" height="220"
        rx="16"
        fill="url(#bgGlow)"/>

  <!-- Header -->
  <circle cx="35" cy="35" r="5" fill="#EE4C2C"/>
  <circle cx="35" cy="35" r="8" fill="#EE4C2C" opacity=".15"/>
  <circle cx="35" cy="35" r="8" fill="#EE4C2C" class="pulse"/>

  <text x="55" y="40" class="title">
    SISTEM TELEMETRI ITS • FTEIC • AKTIF
  </text>

  <text x="530" y="40" class="sub">
    UPTIME 24/7
  </text>

  <line x1="25" y1="58" x2="595" y2="58"
        stroke="#1E293B"/>

  <!-- Card 1 -->
  <rect x="25" y="78"
        width="250" height="115"
        rx="12"
        fill="#0F172A"
        stroke="#1E293B"/>

  <text x="40" y="100" class="label" fill="#EE4C2C">
    PENGEMBANG UTAMA
  </text>

  <text x="40" y="125" class="value" font-weight="700">
    Thomas Alfareno
  </text>

  <text x="40" y="142" class="value">
    Ananta Nugraha
  </text>

  <text x="40" y="164" class="sub">
    Teknik Informatika • Angkatan 2026
  </text>

  <text x="40" y="181" class="sub">
    Institut Teknologi Sepuluh Nopember
  </text>

  <!-- Card 2 -->
  <rect x="295" y="78"
        width="145" height="115"
        rx="12"
        fill="#0F172A"
        stroke="#1E293B"/>

  <text x="310" y="100" class="label" fill="#A78BFA">
    STATUS NODE
  </text>

  <circle cx="318" cy="124"
          r="4"
          fill="#4ADE80"
          class="online"/>

  <text x="330" y="128"
        class="value"
        fill="#4ADE80">
    ONLINE
  </text>

  <text x="310" y="150" class="sub">
    Backend
  </text>

  <text x="310" y="165" class="value">
    PyTorch + MySQL
  </text>

  <text x="310" y="182" class="sub">
    Decoder Optimized
  </text>

  <!-- Card 3 -->
  <rect x="460" y="78"
        width="135" height="115"
        rx="12"
        fill="#0F172A"
        stroke="#1E293B"/>

  <text x="475" y="100"
        class="label"
        fill="#4ADE80">
    SINYAL REAL-TIME
  </text>

  <path d="M475 145
           Q490 120 505 145
           T535 145
           T565 145
           T590 132"
        stroke="#1E293B"
        stroke-width="2.5"
        fill="none"/>

  <path d="M475 145
           Q490 120 505 145
           T535 145
           T565 145
           T590 132"
        fill="none"
        class="wave"/>

  <circle cx="590"
          cy="132"
          r="4"
          fill="#6366F1"/>

  <text x="465" y="178"
        class="sub">
    Telemetry Stream Stable
  </text>

</svg>
